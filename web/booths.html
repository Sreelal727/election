<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booth-wise Vote Estimates - Kochi 2026</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ldf:#e53935;--udf:#1e88e5;--nda:#f9a825;
      --bg:#07080c;--surface:#11131a;--surface2:#1a1e2a;--surface3:#232838;
      --text:#eaedf3;--text2:#6b7280;--border:#1f2433;--accent:#4ecdc4;
      --green:#22c55e;--red:#ef4444;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
    .mono{font-family:'JetBrains Mono',monospace}

    .topbar{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(7,8,12,0.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:16px}
    .topbar .logo{font-weight:800;font-size:1rem;background:linear-gradient(135deg,#ff6b6b,#4ecdc4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .topbar a{color:var(--text2);text-decoration:none;font-size:.85rem;padding:6px 14px;border:1px solid var(--border);border-radius:8px;transition:all .2s}
    .topbar a:hover{border-color:var(--accent);color:var(--text)}

    .container{max-width:1300px;margin:0 auto;padding:72px 20px 40px}

    .hero{text-align:center;padding:32px 0 24px;border-bottom:1px solid var(--border);margin-bottom:24px}
    .hero h1{font-size:2.2rem;font-weight:900;margin:4px 0}
    .hero-sub{color:var(--text2);font-size:.9rem}

    /* Summary strip */
    .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
    .sum-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
    .sum-card .label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text2)}
    .sum-card .value{font-size:1.8rem;font-weight:900;margin:4px 0;line-height:1}
    .sum-card .sub{font-size:.75rem;color:var(--text2)}
    .sum-card.udf{border-top:3px solid var(--udf)}.sum-card.udf .value{color:var(--udf)}
    .sum-card.ldf{border-top:3px solid var(--ldf)}.sum-card.ldf .value{color:var(--ldf)}
    .sum-card.nda{border-top:3px solid var(--nda)}.sum-card.nda .value{color:var(--nda)}
    .sum-card.total{border-top:3px solid var(--accent)}.sum-card.total .value{color:var(--accent)}

    /* Charts row */
    .charts-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
    .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
    .chart-card h3{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text2);margin-bottom:12px}

    /* Zone cards */
    .zone-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:24px}
    .zone-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;position:relative;overflow:hidden}
    .zone-card .zone-name{font-weight:700;font-size:.85rem;margin-bottom:8px}
    .zone-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:1px;margin:6px 0}
    .zone-bar div{border-radius:3px}
    .zone-stat{font-size:.75rem;color:var(--text2);margin:2px 0}
    .zone-stat b{color:var(--text)}
    .zone-lead{font-size:.8rem;font-weight:800;margin-top:6px}

    /* Filters */
    .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
    .filters select,.filters input{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:.85rem;font-family:inherit}
    .filters input{width:180px}
    .result-count{font-size:.8rem;color:var(--text2);margin-left:auto}

    /* Table */
    .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
    table{width:100%;border-collapse:collapse;font-size:.8rem}
    th{position:sticky;top:0;background:var(--surface2);padding:10px 8px;text-align:left;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text2);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer}
    th:hover{color:var(--accent)}
    td{padding:8px;border-bottom:1px solid var(--border);white-space:nowrap}
    tr:hover{background:var(--surface2)}
    tr:last-child td{border-bottom:none}

    .bar-cell{position:relative;min-width:120px}
    .bar-bg{display:flex;height:16px;border-radius:3px;overflow:hidden;gap:1px;background:var(--surface3)}
    .bar-bg div{border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:#fff;min-width:0;overflow:hidden}

    .winner-tag{font-size:.65rem;font-weight:700;padding:2px 6px;border-radius:4px}
    .winner-tag.UDF{background:rgba(30,136,229,.15);color:var(--udf)}
    .winner-tag.LDF{background:rgba(229,57,53,.15);color:var(--ldf)}
    .winner-tag.NDA{background:rgba(249,168,37,.15);color:var(--nda)}

    .type-badge{display:inline-block;width:22px;height:22px;border-radius:6px;text-align:center;line-height:22px;font-weight:800;font-size:.75rem}

    .corrected{color:var(--nda);font-size:.7rem}

    @media(max-width:900px){
      .summary{grid-template-columns:repeat(2,1fr)}
      .zone-strip{grid-template-columns:1fr 1fr}
      .charts-row{grid-template-columns:1fr}
      .hero h1{font-size:1.5rem}
    }
  </style>
</head>
<body>
<div class="topbar">
  <span class="logo">Booth-wise Estimates</span>
  <a href="index.html">Overview</a>
  <a href="deep.html">Deep Analysis</a>
</div>

<div class="container">
  <div class="hero">
    <div style="font-size:.75rem;color:var(--accent);font-weight:700;letter-spacing:2px;text-transform:uppercase">Booth-wise Vote Estimates</div>
    <h1>Kochi Constituency (#80)</h1>
    <div class="hero-sub">240 parts | SIR 2026 Electoral Roll | Estimated 77% turnout</div>
  </div>

  <div class="summary" id="summaryCards"></div>
  <div class="zone-strip" id="zoneStrip"></div>
  <div class="charts-row">
    <div class="chart-card"><h3>Zone-wise Vote Distribution</h3><canvas id="zoneChart"></canvas></div>
    <div class="chart-card"><h3>Booth Type Breakdown</h3><canvas id="typeChart"></canvas></div>
  </div>

  <div class="filters">
    <select id="zoneFilter"><option value="">All Zones</option></select>
    <select id="typeFilter"><option value="">All Types</option></select>
    <select id="winnerFilter"><option value="">All Winners</option><option value="UDF">UDF</option><option value="LDF">LDF</option><option value="NDA">NDA</option></select>
    <input type="text" id="searchInput" placeholder="Search location...">
    <span class="result-count" id="resultCount"></span>
  </div>

  <div class="table-wrap">
    <table id="boothTable">
      <thead><tr>
        <th data-col="Part_No">Part</th>
        <th data-col="Mapped_Booth">Booth</th>
        <th data-col="Location">Location</th>
        <th data-col="Zone">Zone</th>
        <th data-col="Booth_Type">Type</th>
        <th data-col="Registered_Voters">Voters</th>
        <th data-col="Est_Polled">Polled</th>
        <th>Vote Split</th>
        <th data-col="Est_UDF">UDF</th>
        <th data-col="Est_LDF">LDF</th>
        <th data-col="Est_NDA">NDA</th>
        <th data-col="Est_Winner">Winner</th>
        <th data-col="Est_Margin">Margin</th>
      </tr></thead>
      <tbody id="boothBody"></tbody>
    </table>
  </div>
</div>

<script>
const TYPE_COLORS = {A:'#1e88e5',B:'#22c55e',C:'#f59e0b',D:'#f97316',E:'#ef4444',F:'#7c3aed'};
const TYPE_LABELS = {A:'UDF Safe',B:'Close/Flip',C:'Recoverable',D:'Ex-T20→NDA',E:'BJP Zone',F:'LDF Fort'};
let allRows = [];
let sortCol = 'Part_No';
let sortAsc = true;
let charts = [];

async function init() {
  const res = await fetch('constituencies/kochi_booth_estimates.csv');
  const text = await res.text();
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',');
  allRows = lines.slice(1).map(line => {
    const vals = line.split(',');
    const obj = {};
    headers.forEach((h, i) => obj[h.trim()] = vals[i]?.trim() || '');
    return obj;
  });
  renderSummary();
  renderZones();
  renderCharts();
  populateFilters();
  renderTable(allRows);
  setupSort();
}

function num(n) { return Number(n).toLocaleString(); }

function renderSummary() {
  const totalUDF = allRows.reduce((s,r) => s + +r.Est_UDF, 0);
  const totalLDF = allRows.reduce((s,r) => s + +r.Est_LDF, 0);
  const totalNDA = allRows.reduce((s,r) => s + +r.Est_NDA, 0);
  const totalVoters = allRows.reduce((s,r) => s + +r.Registered_Voters, 0);
  const udfWins = allRows.filter(r => r.Est_Winner==='UDF').length;
  const ldfWins = allRows.filter(r => r.Est_Winner==='LDF').length;
  const ndaWins = allRows.filter(r => r.Est_Winner==='NDA').length;

  document.getElementById('summaryCards').innerHTML = `
    <div class="sum-card total"><div class="label">Total Voters</div><div class="value mono">${num(totalVoters)}</div><div class="sub">240 parts | 77% turnout</div></div>
    <div class="sum-card udf"><div class="label">UDF Estimated</div><div class="value mono">${num(totalUDF)}</div><div class="sub">${udfWins} parts won</div></div>
    <div class="sum-card ldf"><div class="label">LDF Estimated</div><div class="value mono">${num(totalLDF)}</div><div class="sub">${ldfWins} parts won</div></div>
    <div class="sum-card nda"><div class="label">NDA Estimated</div><div class="value mono">${num(totalNDA)}</div><div class="sub">${ndaWins} parts won</div></div>
  `;
}

function renderZones() {
  const zones = {};
  allRows.forEach(r => {
    const z = r.Zone || 'Other';
    if (!zones[z]) zones[z] = {udf:0,ldf:0,nda:0,parts:0,reg:0};
    zones[z].udf += +r.Est_UDF; zones[z].ldf += +r.Est_LDF; zones[z].nda += +r.Est_NDA;
    zones[z].parts += 1; zones[z].reg += +r.Registered_Voters;
  });

  document.getElementById('zoneStrip').innerHTML = Object.entries(zones).sort().map(([z,d]) => {
    const total = d.udf + d.ldf + d.nda;
    const up = d.udf/total*100, lp = d.ldf/total*100, np = d.nda/total*100;
    const winner = d.udf>=d.ldf&&d.udf>=d.nda?'UDF':(d.ldf>=d.nda?'LDF':'NDA');
    const margin = Math.max(d.udf,d.ldf,d.nda) - [d.udf,d.ldf,d.nda].sort((a,b)=>b-a)[1];
    const wColor = winner==='UDF'?'var(--udf)':(winner==='LDF'?'var(--ldf)':'var(--nda)');
    return `<div class="zone-card">
      <div class="zone-name">${z}</div>
      <div class="zone-stat"><b>${d.parts}</b> parts | <b>${num(d.reg)}</b> voters</div>
      <div class="zone-bar">
        <div style="width:${up}%;background:var(--udf)"></div>
        <div style="width:${lp}%;background:var(--ldf)"></div>
        <div style="width:${np}%;background:var(--nda)"></div>
      </div>
      <div class="zone-stat">UDF <b>${num(d.udf)}</b> | LDF <b>${num(d.ldf)}</b> | NDA <b>${num(d.nda)}</b></div>
      <div class="zone-lead" style="color:${wColor}">${winner} +${num(margin)}</div>
    </div>`;
  }).join('');
}

function renderCharts() {
  charts.forEach(c=>c.destroy()); charts=[];
  // Zone chart
  const zones = {};
  allRows.forEach(r => {
    const z = r.Zone || 'Other';
    if(!zones[z]) zones[z]={udf:0,ldf:0,nda:0};
    zones[z].udf+=+r.Est_UDF;zones[z].ldf+=+r.Est_LDF;zones[z].nda+=+r.Est_NDA;
  });
  const zLabels = Object.keys(zones).sort();
  charts.push(new Chart(document.getElementById('zoneChart'),{
    type:'bar',
    data:{labels:zLabels,datasets:[
      {label:'UDF',data:zLabels.map(z=>zones[z].udf),backgroundColor:'#1e88e5',borderRadius:4},
      {label:'LDF',data:zLabels.map(z=>zones[z].ldf),backgroundColor:'#e53935',borderRadius:4},
      {label:'NDA',data:zLabels.map(z=>zones[z].nda),backgroundColor:'#f9a825',borderRadius:4},
    ]},
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{color:'#8b8fa3',padding:10}}},
      scales:{x:{grid:{display:false},ticks:{color:'#6b7280',font:{size:10}}},y:{grid:{color:'rgba(255,255,255,.05)'},ticks:{color:'#6b7280',callback:v=>(v/1000)+'K'}}}}
  }));

  // Type chart
  const types = {};
  allRows.forEach(r => {
    const t = r.Booth_Type || '?';
    if(!types[t]) types[t]={udf:0,ldf:0,nda:0,count:0};
    types[t].udf+=+r.Est_UDF;types[t].ldf+=+r.Est_LDF;types[t].nda+=+r.Est_NDA;types[t].count++;
  });
  const tLabels = ['A','B','C','D','E','F'].filter(t=>types[t]);
  charts.push(new Chart(document.getElementById('typeChart'),{
    type:'bar',
    data:{labels:tLabels.map(t=>`${t} - ${TYPE_LABELS[t]||t}`),datasets:[
      {label:'UDF',data:tLabels.map(t=>types[t].udf),backgroundColor:'#1e88e5',borderRadius:4},
      {label:'LDF',data:tLabels.map(t=>types[t].ldf),backgroundColor:'#e53935',borderRadius:4},
      {label:'NDA',data:tLabels.map(t=>types[t].nda),backgroundColor:'#f9a825',borderRadius:4},
    ]},
    options:{indexAxis:'y',responsive:true,plugins:{legend:{position:'bottom',labels:{color:'#8b8fa3',padding:10}}},
      scales:{x:{grid:{color:'rgba(255,255,255,.05)'},ticks:{color:'#6b7280',callback:v=>(v/1000)+'K'}},y:{grid:{display:false},ticks:{color:'#eaedf3',font:{size:11}}}}}
  }));
}

function populateFilters() {
  const zones = [...new Set(allRows.map(r=>r.Zone).filter(Boolean))].sort();
  const zf = document.getElementById('zoneFilter');
  zones.forEach(z=>{const o=document.createElement('option');o.value=z;o.textContent=z;zf.appendChild(o)});

  const types = [...new Set(allRows.map(r=>r.Booth_Type).filter(Boolean))].sort();
  const tf = document.getElementById('typeFilter');
  types.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=`Type ${t} - ${TYPE_LABELS[t]||t}`;tf.appendChild(o)});

  ['zoneFilter','typeFilter','winnerFilter'].forEach(id=>document.getElementById(id).addEventListener('change',applyFilters));
  document.getElementById('searchInput').addEventListener('input',applyFilters);
}

function applyFilters() {
  let f = allRows;
  const zone = document.getElementById('zoneFilter').value;
  const type = document.getElementById('typeFilter').value;
  const winner = document.getElementById('winnerFilter').value;
  const search = document.getElementById('searchInput').value.toLowerCase();
  if(zone) f=f.filter(r=>r.Zone===zone);
  if(type) f=f.filter(r=>r.Booth_Type===type);
  if(winner) f=f.filter(r=>r.Est_Winner===winner);
  if(search) f=f.filter(r=>(r.Location||'').toLowerCase().includes(search)||(r.Zone||'').toLowerCase().includes(search));
  document.getElementById('resultCount').textContent=f.length+' parts';
  renderTable(f);
}

function renderTable(data) {
  const sorted = [...data].sort((a,b) => {
    let va = a[sortCol], vb = b[sortCol];
    const na = Number(va), nb = Number(vb);
    if (!isNaN(na) && !isNaN(nb)) { va=na; vb=nb; }
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });

  document.getElementById('resultCount').textContent = data.length + ' parts';
  const tbody = document.getElementById('boothBody');
  tbody.innerHTML = sorted.map(r => {
    const u=+r.Est_UDF,l=+r.Est_LDF,n=+r.Est_NDA;
    const total=u+l+n;
    const up=total?u/total*100:0, lp=total?l/total*100:0, np=total?n/total*100:0;
    const tc = TYPE_COLORS[r.Booth_Type]||'#555';
    const corr = r.SIR_Corrected==='Y' ? '<span class="corrected">*</span>' : '';

    return `<tr>
      <td class="mono" style="font-weight:700">${r.Part_No}</td>
      <td class="mono">${r.Mapped_Booth}</td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis" title="${r.Location}">${r.Location||'—'}</td>
      <td style="font-size:.75rem">${r.Zone||'—'}</td>
      <td><span class="type-badge" style="background:${tc}20;color:${tc}">${r.Booth_Type||'?'}</span></td>
      <td class="mono" style="text-align:right">${num(r.Registered_Voters)}${corr}</td>
      <td class="mono" style="text-align:right">${num(r.Est_Polled)}</td>
      <td class="bar-cell"><div class="bar-bg">
        <div style="width:${up}%;background:var(--udf)">${u>30?u:''}</div>
        <div style="width:${lp}%;background:var(--ldf)">${l>30?l:''}</div>
        <div style="width:${np}%;background:var(--nda)">${n>30?n:''}</div>
      </div></td>
      <td class="mono" style="text-align:right;color:var(--udf)">${num(u)}</td>
      <td class="mono" style="text-align:right;color:var(--ldf)">${num(l)}</td>
      <td class="mono" style="text-align:right;color:var(--nda)">${num(n)}</td>
      <td><span class="winner-tag ${r.Est_Winner}">${r.Est_Winner}</span></td>
      <td class="mono" style="text-align:right;font-weight:700">${num(r.Est_Margin)}</td>
    </tr>`;
  }).join('');
}

function setupSort() {
  document.querySelectorAll('th[data-col]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol === col) sortAsc = !sortAsc;
      else { sortCol = col; sortAsc = true; }
      document.querySelectorAll('th').forEach(t=>t.style.color='');
      th.style.color = 'var(--accent)';
      applyFilters();
    });
  });
}

init();
</script>
</body>
</html>
