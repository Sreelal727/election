<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kochi (#80) — Live Vote Share & Erosion Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07080c;
  --surface: #0f1118;
  --surface2: #161a25;
  --border: #1e2230;
  --text: #e8eaf0;
  --dim: #7a8194;
  --accent: #4ecdc4;
  --ldf: #e53935;
  --udf: #1e88e5;
  --nda: #f9a825;
  --green: #4caf50;
  --red: #ff5252;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  padding: 28px 36px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 28px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.header h1 { font-size: 20px; font-weight: 700; }
.header h1 .num { color: var(--accent); }
.header .meta { font-size: 12px; color: var(--dim); font-family: 'JetBrains Mono', monospace; }
.header .meta strong { color: var(--accent); }

/* Vote cards */
.vote-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.vote-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px 24px;
  position: relative;
  overflow: hidden;
}
.vote-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}
.vote-card.ldf::before { background: var(--ldf); }
.vote-card.udf::before { background: var(--udf); }
.vote-card.nda::before { background: var(--nda); }

.vote-card .front {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.vote-card.ldf .front { color: var(--ldf); }
.vote-card.udf .front { color: var(--udf); }
.vote-card.nda .front { color: var(--nda); }

.vote-card .candidate {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 12px;
  color: #fff;
}
.vote-card .party { font-weight: 400; color: var(--dim); }

.vote-card .big-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 36px;
  font-weight: 700;
  line-height: 1;
}
.vote-card .big-label {
  font-size: 10px;
  color: var(--dim);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-top: 4px;
}
.vote-card .sub-row {
  display: flex;
  gap: 20px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.vote-card .sub-item {
  text-align: center;
  flex: 1;
}
.vote-card .sub-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  font-weight: 700;
}
.vote-card .sub-label {
  font-size: 9px;
  color: var(--dim);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-top: 2px;
}

/* Sentiment weight badge */
.sent-badge {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 4px;
  margin-top: 10px;
}

/* Stacked bar */
.stacked-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 22px 24px;
  margin-bottom: 24px;
}
.stacked-section .title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 16px;
}
.stacked-bar-wrap {
  margin-bottom: 16px;
}
.stacked-label {
  font-size: 11px;
  color: var(--dim);
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
}
.stacked-bar {
  display: flex;
  height: 40px;
  border-radius: 6px;
  overflow: hidden;
  background: var(--surface2);
}
.stacked-bar .seg {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  transition: width 1s ease;
  min-width: 40px;
}

/* Charts */
.charts-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}
.chart-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
}
.chart-panel .title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 14px;
}
.chart-container { position: relative; height: 260px; }

/* Erosion tracker */
.erosion-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 4px solid var(--red);
  border-radius: 12px;
  padding: 22px 24px;
  margin-bottom: 24px;
}
.erosion-section .title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 14px;
}
.erosion-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
.erosion-card {
  background: var(--surface2);
  border-radius: 8px;
  padding: 14px;
  text-align: center;
}
.erosion-card .num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px;
  font-weight: 700;
}
.erosion-card .label {
  font-size: 9px;
  color: var(--dim);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-top: 4px;
}

/* Vote flow */
.flow-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 22px 24px;
  margin-bottom: 24px;
}
.flow-section .title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 16px;
}
.flow-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.flow-row:last-child { border-bottom: none; }
.flow-source {
  width: 120px;
  font-weight: 600;
  flex-shrink: 0;
}
.flow-arrow { color: var(--dim); flex-shrink: 0; }
.flow-dest { font-weight: 600; width: 60px; flex-shrink: 0; }
.flow-bar-track {
  flex: 1;
  height: 16px;
  background: var(--surface2);
  border-radius: 4px;
  overflow: hidden;
}
.flow-bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 1s ease;
}
.flow-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  width: 70px;
  text-align: right;
  flex-shrink: 0;
}

.footer {
  font-size: 9px;
  color: #333;
  text-align: center;
  margin-top: 20px;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>

<div class="header">
  <h1>Kochi <span class="num">#80</span> — Vote Share & Erosion Tracker</h1>
  <div class="meta">Updated: <strong id="updatedTime">--</strong> &nbsp;|&nbsp; GreyCell Sentinel &nbsp;|&nbsp; Election Day: <strong>9 Apr 2026</strong></div>
</div>

<div id="content">Loading predictions...</div>

<script>
const COLORS = { LDF: '#e53935', UDF: '#1e88e5', NDA: '#f9a825' };
const TOTAL_ELECTORS = 151376;
const TURNOUT = 0.77;
const EST_POLLED = Math.floor(TOTAL_ELECTORS * TURNOUT);
const V2021 = { UDF: 39865, LDF: 53973, NDA: 10370, T20: 19536 };

async function loadAndRender() {
  const [predData, trendData, sentData] = await Promise.all([
    fetch('/api/predictions').then(r => r.json()),
    fetch('/api/trends').then(r => r.json()),
    fetch('/api/sentiment').then(r => r.json()),
  ]);

  const preds = predData.predictions || predData;
  const kochi = (Array.isArray(preds) ? preds : []).find(p => p.Constituency_No === 80);
  if (!kochi) { document.getElementById('content').textContent = 'Kochi data not found'; return; }

  const updates = trendData.updates || [];
  const sentApplied = kochi.Sentiment_Applied || {};

  // Vote projections
  const projUDF = Math.round(EST_POLLED * kochi.Adjusted_UDF / 100);
  const projLDF = Math.round(EST_POLLED * kochi.Adjusted_LDF / 100);
  const projNDA = Math.round(EST_POLLED * kochi.Adjusted_NDA / 100);
  const projOth = EST_POLLED - projUDF - projLDF - projNDA;
  const margin = projUDF - projLDF;

  // Changes from 2021
  const chgUDF = projUDF - V2021.UDF;
  const chgLDF = projLDF - V2021.LDF;
  const chgNDA = projNDA - (V2021.NDA + V2021.T20);

  // Erosion calculation
  const hoursToEDay = Math.max(0, (new Date('2026-04-09T18:00:00+05:30') - Date.now()) / 3600000);
  const erosionRate = 4.9;
  const cycles = hoursToEDay / 18;
  const marginLossPerCycle = Math.round(margin * erosionRate / 100);
  const totalErosion = Math.round(marginLossPerCycle * cycles);
  const edayMargin = Math.max(0, margin - totalErosion);
  const interventionRecovery = Math.round(totalErosion * 0.45);

  document.getElementById('updatedTime').textContent = predData.last_updated
    ? new Date(predData.last_updated).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' })
    : 'Base predictions';

  let html = '';

  // ===== VOTE CARDS =====
  html += '<div class="vote-row">';
  const cards = [
    { front: 'UDF', cls: 'udf', cand: kochi.UDF_Candidate, party: kochi.UDF_Party, votes: projUDF, share: kochi.Adjusted_UDF, prob: kochi.UDF_Win_Prob, chg: chgUDF, base21: V2021.UDF, sent: sentApplied.UDF || 0 },
    { front: 'LDF', cls: 'ldf', cand: kochi.LDF_Candidate, party: kochi.LDF_Party, votes: projLDF, share: kochi.Adjusted_LDF, prob: kochi.LDF_Win_Prob, chg: chgLDF, base21: V2021.LDF, sent: sentApplied.LDF || 0 },
    { front: 'NDA', cls: 'nda', cand: kochi.NDA_Candidate, party: kochi.NDA_Party, votes: projNDA, share: kochi.Adjusted_NDA, prob: kochi.NDA_Win_Prob, chg: chgNDA, base21: V2021.NDA + V2021.T20, sent: sentApplied.NDA || 0 },
  ];
  for (const c of cards) {
    const chgSign = c.chg >= 0 ? '+' : '';
    const chgColor = c.chg >= 0 ? 'var(--green)' : 'var(--red)';
    const sentSign = c.sent >= 0 ? '+' : '';
    const sentColor = c.sent > 0.05 ? 'var(--green)' : c.sent < -0.05 ? 'var(--red)' : 'var(--dim)';
    const sentBg = c.sent > 0.05 ? 'rgba(76,175,80,0.15)' : c.sent < -0.05 ? 'rgba(255,82,82,0.15)' : 'rgba(122,129,148,0.1)';
    html += `
      <div class="vote-card ${c.cls}">
        <div class="front">${c.front}</div>
        <div class="candidate">${c.cand} <span class="party">(${c.party})</span></div>
        <div class="big-num" style="color:${COLORS[c.front]}">${c.votes.toLocaleString()}</div>
        <div class="big-label">Projected Votes</div>
        <div class="sent-badge" style="background:${sentBg};color:${sentColor}">SENTIMENT: ${sentSign}${c.sent.toFixed(3)} pct</div>
        <div class="sub-row">
          <div class="sub-item">
            <div class="sub-num" style="color:${COLORS[c.front]}">${c.share.toFixed(1)}%</div>
            <div class="sub-label">Vote Share</div>
          </div>
          <div class="sub-item">
            <div class="sub-num" style="color:${COLORS[c.front]}">${c.prob.toFixed(1)}%</div>
            <div class="sub-label">Win Prob</div>
          </div>
          <div class="sub-item">
            <div class="sub-num" style="color:${chgColor}">${chgSign}${c.chg.toLocaleString()}</div>
            <div class="sub-label">vs 2021</div>
          </div>
        </div>
      </div>`;
  }
  html += '</div>';

  // ===== STACKED BARS =====
  html += `
    <div class="stacked-section">
      <div class="title">Vote Share Comparison — 2021 vs 2026</div>
      <div class="stacked-bar-wrap">
        <div class="stacked-label"><span>2021 Actual</span><span>${(V2021.UDF+V2021.LDF+V2021.NDA+V2021.T20).toLocaleString()} total votes</span></div>
        <div class="stacked-bar">
          <div class="seg" style="width:${V2021.LDF/(V2021.UDF+V2021.LDF+V2021.NDA+V2021.T20)*100}%;background:var(--ldf)">LDF ${(V2021.LDF/1000).toFixed(1)}K</div>
          <div class="seg" style="width:${V2021.UDF/(V2021.UDF+V2021.LDF+V2021.NDA+V2021.T20)*100}%;background:var(--udf)">UDF ${(V2021.UDF/1000).toFixed(1)}K</div>
          <div class="seg" style="width:${V2021.T20/(V2021.UDF+V2021.LDF+V2021.NDA+V2021.T20)*100}%;background:#ff9800">T20 ${(V2021.T20/1000).toFixed(1)}K</div>
          <div class="seg" style="width:${V2021.NDA/(V2021.UDF+V2021.LDF+V2021.NDA+V2021.T20)*100}%;background:var(--nda)">NDA ${(V2021.NDA/1000).toFixed(1)}K</div>
        </div>
      </div>
      <div class="stacked-bar-wrap">
        <div class="stacked-label"><span>2026 Projected (with sentiment)</span><span>${EST_POLLED.toLocaleString()} est. polled</span></div>
        <div class="stacked-bar">
          <div class="seg" style="width:${kochi.Adjusted_LDF}%;background:var(--ldf)">LDF ${(projLDF/1000).toFixed(1)}K</div>
          <div class="seg" style="width:${kochi.Adjusted_UDF}%;background:var(--udf)">UDF ${(projUDF/1000).toFixed(1)}K</div>
          <div class="seg" style="width:${kochi.Adjusted_NDA}%;background:var(--nda)">NDA ${(projNDA/1000).toFixed(1)}K</div>
          <div class="seg" style="width:${(100-kochi.Adjusted_LDF-kochi.Adjusted_UDF-kochi.Adjusted_NDA)}%;background:#555">Oth</div>
        </div>
      </div>
    </div>`;

  // ===== CHARTS ROW =====
  html += `
    <div class="charts-row">
      <div class="chart-panel">
        <div class="title">Sentiment Adjustments Over Time</div>
        <div class="chart-container"><canvas id="sentChart"></canvas></div>
      </div>
      <div class="chart-panel">
        <div class="title">UDF Seat Projection Trend</div>
        <div class="chart-container"><canvas id="seatChart"></canvas></div>
      </div>
    </div>`;

  // ===== EROSION TRACKER =====
  html += `
    <div class="erosion-section">
      <div class="title">Margin Erosion Tracker — ${Math.round(hoursToEDay)} Hours to E-Day</div>
      <div class="erosion-grid">
        <div class="erosion-card">
          <div class="num" style="color:var(--udf)">${margin.toLocaleString()}</div>
          <div class="label">Current Margin</div>
        </div>
        <div class="erosion-card">
          <div class="num" style="color:var(--red)">-${totalErosion.toLocaleString()}</div>
          <div class="label">Est. Erosion by E-Day</div>
        </div>
        <div class="erosion-card">
          <div class="num" style="color:${edayMargin > 5000 ? 'var(--green)' : edayMargin > 2000 ? 'var(--nda)' : 'var(--red)'}">${edayMargin.toLocaleString()}</div>
          <div class="label">E-Day Margin (No Action)</div>
        </div>
        <div class="erosion-card">
          <div class="num" style="color:var(--green)">${(edayMargin + interventionRecovery).toLocaleString()}</div>
          <div class="label">With 12-Booth Intervention</div>
        </div>
      </div>
    </div>`;

  // ===== VOTE FLOW =====
  const ldfLoss = V2021.LDF - projLDF;
  const flows = [
    { src: 'LDF Anti-Inc', dest: 'UDF', val: Math.round(ldfLoss * 0.55), color: 'var(--udf)', max: 20000 },
    { src: 'LDF Anti-Inc', dest: 'NDA', val: Math.round(ldfLoss * 0.10), color: 'var(--nda)', max: 20000 },
    { src: 'LDF Anti-Inc', dest: 'NOTA', val: Math.round(ldfLoss * 0.35), color: '#555', max: 20000 },
    { src: 'T20 (19,536)', dest: 'NDA', val: 12698, color: 'var(--nda)', max: 20000 },
    { src: 'T20 (19,536)', dest: 'UDF', val: 4884, color: 'var(--udf)', max: 20000 },
    { src: 'T20 (19,536)', dest: 'Float', val: 1954, color: '#888', max: 20000 },
  ];

  html += `
    <div class="flow-section">
      <div class="title">Vote Flow Decomposition — Where the Votes Moved</div>`;
  for (const f of flows) {
    const pct = Math.min(100, (f.val / f.max) * 100);
    html += `
      <div class="flow-row">
        <div class="flow-source">${f.src}</div>
        <div class="flow-arrow">→</div>
        <div class="flow-dest" style="color:${f.color}">${f.dest}</div>
        <div class="flow-bar-track"><div class="flow-bar-fill" style="width:${pct}%;background:${f.color}"></div></div>
        <div class="flow-num" style="color:${f.color}">+${f.val.toLocaleString()}</div>
      </div>`;
  }
  html += '</div>';

  html += '<div class="footer">GREYCELL SENTINEL v4.2.1 | Kochi Constituency #80 | Ernakulam District | CONFIDENTIAL</div>';

  document.getElementById('content').innerHTML = html;

  // ===== RENDER CHARTS =====
  requestAnimationFrame(() => {
    // Sentiment chart
    if (updates.length > 1) {
      const labels = updates.map(u => {
        const d = new Date(u.timestamp);
        return d.toLocaleString('en-IN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Kolkata' });
      });
      new Chart(document.getElementById('sentChart'), {
        type: 'line',
        data: {
          labels,
          datasets: [
            { label: 'UDF', data: updates.map(u => u.sentiment_applied?.UDF || 0), borderColor: '#1e88e5', borderWidth: 2, tension: 0.3, pointRadius: 3, pointBackgroundColor: '#1e88e5' },
            { label: 'LDF', data: updates.map(u => u.sentiment_applied?.LDF || 0), borderColor: '#e53935', borderWidth: 2, tension: 0.3, pointRadius: 3, pointBackgroundColor: '#e53935' },
            { label: 'NDA', data: updates.map(u => u.sentiment_applied?.NDA || 0), borderColor: '#f9a825', borderWidth: 2, tension: 0.3, pointRadius: 3, pointBackgroundColor: '#f9a825' },
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#7a8194', font: { size: 11 } } } },
          scales: {
            x: { ticks: { color: '#444', font: { size: 9 }, maxTicksLimit: 8, maxRotation: 45 }, grid: { color: '#111' } },
            y: { ticks: { color: '#444', font: { size: 10 } }, grid: { color: '#111' } }
          }
        }
      });
    }

    // Seat trend chart
    if (updates.length > 1) {
      const labels = updates.map(u => {
        const d = new Date(u.timestamp);
        return d.toLocaleString('en-IN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Kolkata' });
      });
      new Chart(document.getElementById('seatChart'), {
        type: 'line',
        data: {
          labels,
          datasets: [
            { label: 'UDF Seats', data: updates.map(u => u.seat_projections?.UDF?.median || 0), borderColor: '#1e88e5', backgroundColor: 'rgba(30,136,229,0.1)', borderWidth: 2, fill: true, tension: 0.3, pointRadius: 3 },
            { label: 'LDF Seats', data: updates.map(u => u.seat_projections?.LDF?.median || 0), borderColor: '#e53935', backgroundColor: 'rgba(229,57,53,0.1)', borderWidth: 2, fill: true, tension: 0.3, pointRadius: 3 },
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#7a8194', font: { size: 11 } } },
          },
          scales: {
            x: { ticks: { color: '#444', font: { size: 9 }, maxTicksLimit: 8, maxRotation: 45 }, grid: { color: '#111' } },
            y: { ticks: { color: '#444', font: { size: 10 } }, grid: { color: '#111' }, suggestedMin: 30, suggestedMax: 100 }
          }
        }
      });
    }
  });
}

loadAndRender();
setInterval(loadAndRender, 120000);
</script>
</body>
</html>
